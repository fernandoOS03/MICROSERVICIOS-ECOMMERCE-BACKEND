spring.application.name=tema05-servicio-catagalo

server.port=8086
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

resilience4j.circuitbreaker.instances.servicio-categorias.failureRateThreshold=50
resilience4j.circuitbreaker.instances.servicio-categorias.slidingWindowSize=5
resilience4j.circuitbreaker.instances.servicio-categorias.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.servicio-categorias.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.servicio-categorias.automaticTransitionFromOpenToHalfOpenEnabled=true
